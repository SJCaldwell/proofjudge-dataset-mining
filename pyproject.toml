[project]
name = "proofjudge-dataset-mining"
version = "0.1.0"
description = "Mine mathlib4 PRs for proof quality triplets (initial proof, final proof, rejection reasons)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "typer>=0.15",
    "rich>=13.9",
    "anthropic>=0.43",
    "tenacity>=9.0",
    "datasets>=3.2",
    "python-dotenv>=1.0",
]

[project.scripts]
proofjudge = "proofjudge.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.9",
    "pyright>=1.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "PTH",  # flake8-use-pathlib
]

[tool.ruff.lint.isort]
known-first-party = ["proofjudge"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
pythonPlatform = "Darwin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proofjudge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
